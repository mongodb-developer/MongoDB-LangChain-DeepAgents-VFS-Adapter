name: CI

# Run unit tests on every push and pull request.
# Unit tests use no external services (mongomock + moto via dev extras).


on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  # Unit tests construct boto3 clients (mocked) but botocore still needs a
  # region; CI runners have none configured.
  AWS_DEFAULT_REGION: us-east-1


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m unit

