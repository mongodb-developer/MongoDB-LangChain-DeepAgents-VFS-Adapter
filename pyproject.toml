[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents_mongodb_fs"
version = "0.1.0"
description = "MongoDB Atlas-backed filesystem search adapter for LangChain DeepAgents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anuj Panchal", email = "anujpanchal57@gmail.com" }]
requires-python = ">=3.10"
keywords = ["langchain", "mongodb", "atlas", "vector-search", "deepagents", "s3", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "boto3>=1.34.0",
    "pymongo>=4.6.0",
    "langchain-core>=0.2.0",
    "langchain-mongodb>=0.4.0,<0.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-pptx>=0.6.21",
    "olefile>=0.46",
    "tiktoken>=0.7.0",
    "tenacity>=8.2.0",
    "reportlab==4.5.1"
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.1.0"]
bedrock = ["langchain-aws>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[s3,sqs]>=5.0.0",
    "xlwt>=1.3.0",   # write-side .xls generator used only to build test fixtures
    "mongomock>=4.1.0",
    "pymongo>=4.6.0,<4.9",   # mongomock 4.3 doesn't support sort kwarg added in pymongo 4.9
    "testcontainers>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pdoc>=14.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    "twine>=5.0.0",
    "types-boto3>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mongodb-developer/MongoDB-LangChain-DeepAgents-VFS-Adapter"
Documentation = "https://github.com/mongodb-developer/MongoDB-LangChain-DeepAgents-VFS-Adapter/tree/main/docs"
Repository = "https://github.com/mongodb-developer/MongoDB-LangChain-DeepAgents-VFS-Adapter"
Issues = "https://github.com/mongodb-developer/MongoDB-LangChain-DeepAgents-VFS-Adapter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_mongodb_fs"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/deepagents_mongodb_fs --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: fast, no external services",
    "integration: requires Atlas Local or mongomock + moto",
    "e2e: full stack, moto + mongomock (no real credentials needed)",
    "real_e2e: full stack against real Atlas + S3 + OpenAI; skipped if env vars absent",
    "watcher_e2e: PollingWatcher E2E tests; subset of real_e2e; uses 10s poll interval",
]

[tool.coverage.run]
source = ["src/deepagents_mongodb_fs"]
omit = ["tests/*"]
